<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>防災統合ビューア JAPAN β</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="../shared/map-common.css">
<style>.head{background:#16454F}</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
 <div class="head"><b>防災統合ビューア JAPAN</b><span class="beta">ABC β</span></div>
 <div class="body">
  <div class="notice"><b>指定避難所＝開設中ではありません。</b> 命に関わる判断は、必ず国・都道府県・市区町村等の最新公式情報を優先してください。</div>
  <div class="policyline"><span class="source-badge source-a">A 全国公式</span> は直接表示 ／ <span class="source-badge source-b">B オープン</span> は防災主要レイヤーでは現在不使用 ／ <span class="source-badge source-c">C 公式連携</span> は現在地点から公式サイトへ。</div>

  <div class="filters">
   <button class="fbtn active" data-layer="shelter">A 🏠 指定避難所</button>
   <button class="fbtn" data-layer="emergency">A 🏃 緊急避難場所</button>
   <button class="fbtn weather" data-layer="amedas">A ☔ アメダス実況</button>
   <button class="fbtn haz" data-layer="flood">A 🌊 洪水</button>
   <button class="fbtn haz" data-layer="inland">A 💧 内水</button>
   <button class="fbtn haz" data-layer="tsunami">A 🌊 津波</button>
   <button class="fbtn haz" data-layer="hightide">A 🌊 高潮</button>
   <button class="fbtn haz" data-layer="landslide">A ⛰ 土砂災害</button>
  </div>

  <div class="actions">
   <button class="caction" onclick="openRiver()">C 📷🌊☔ 河川カメラ・水位・雨量</button>
   <a class="caction" href="https://www.mlit.go.jp/road/bosai/LIVEcamera.html" target="_blank" rel="noopener">C 📷🛣 道路ライブカメラ</a>
   <button class="primary" onclick="locateMe()">📍 現在地へ</button>
   <button class="secondary" onclick="map.setView([36.2,138.2],5)">🗾 全国表示</button>
  </div>

  <div id="status" class="status">指定避難所はズーム9以上で、表示範囲の全国公式データを取得します。</div>
  <div class="quick">
   <a href="https://www.jma.go.jp/bosai/warning/" target="_blank" rel="noopener">C ⚠️ 気象庁 警報 ↗</a>
   <a href="https://www.jma.go.jp/bosai/nowc/" target="_blank" rel="noopener">C ☔ 雨雲・雷 ↗</a>
   <a href="https://www.river.go.jp/" target="_blank" rel="noopener">C 🌊 川の防災情報 ↗</a>
   <a href="https://disaportal.gsi.go.jp/" target="_blank" rel="noopener">C 🗺 公式ハザード ↗</a>
  </div>
 </div>
</div>
<div class="legend">
 <b>データ設計</b><br>
 <span class="source-badge source-a">A</span> 国土地理院・気象庁等を直接表示<br>
 <span class="source-badge source-b">B</span> 防災の主要判断には現在不使用<br>
 <span class="source-badge source-c">C</span> 国交省等の公式サービスへ連携
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="../shared/map-core.js"></script>
<script>
const {esc,badge}=CDS;
const map=L.map('map',{preferCanvas:true}).setView([36.2,138.2],5);
L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',{
 maxZoom:18,attribution:'出典：<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">国土地理院 地理院タイル</a>'
}).addTo(map);
const status=document.getElementById('status');

const groups={shelter:L.layerGroup().addTo(map),emergency:L.layerGroup(),amedas:L.layerGroup()};
const active={shelter:true,emergency:false,amedas:false,flood:false,inland:false,tsunami:false,hightide:false,landslide:false};
const loaded={shelter:new Set(),emergency:new Set()};
const emergencyPoints=new Map();

const raster={
 flood:L.tileLayer('https://disaportaldata.gsi.go.jp/raster/01_flood_l2_shinsuishin_data/{z}/{x}/{y}.png',{opacity:.55,maxZoom:17,attribution:'ハザードマップポータル'}),
 inland:L.tileLayer('https://disaportaldata.gsi.go.jp/raster/02_naisui_data/{z}/{x}/{y}.png',{opacity:.55,maxZoom:17,attribution:'ハザードマップポータル'}),
 tsunami:L.tileLayer('https://disaportaldata.gsi.go.jp/raster/04_tsunami_newlegend_data/{z}/{x}/{y}.png',{opacity:.55,maxZoom:17,attribution:'ハザードマップポータル'}),
 hightide:L.tileLayer('https://disaportaldata.gsi.go.jp/raster/03_hightide_l2_shinsuishin_data/{z}/{x}/{y}.png',{opacity:.55,maxZoom:17,attribution:'ハザードマップポータル'}),
 landslide:L.layerGroup([
  L.tileLayer('https://disaportaldata.gsi.go.jp/raster/05_dosekiryukeikaikuiki/{z}/{x}/{y}.png',{opacity:.48,maxZoom:17}),
  L.tileLayer('https://disaportaldata.gsi.go.jp/raster/05_kyukeishakeikaikuiki/{z}/{x}/{y}.png',{opacity:.48,maxZoom:17}),
  L.tileLayer('https://disaportaldata.gsi.go.jp/raster/05_jisuberikeikaikuiki/{z}/{x}/{y}.png',{opacity:.48,maxZoom:17})
 ])
};

function lon2tile(lon,z){return Math.floor((lon+180)/360*Math.pow(2,z));}
function lat2tile(lat,z){const r=lat*Math.PI/180,n=Math.pow(2,z);return Math.floor((1-Math.asinh(Math.tan(r))/Math.PI)/2*n);}
function tilesInView(){
 const b=map.getBounds(),z=10,out=[];
 const x1=lon2tile(b.getWest(),z),x2=lon2tile(b.getEast(),z),y1=lat2tile(b.getNorth(),z),y2=lat2tile(b.getSouth(),z);
 for(let x=x1;x<=x2;x++)for(let y=y1;y<=y2;y++)out.push([z,x,y]);
 return out;
}
function getName(p,fallback){
 for(const k of ['name','名称','施設名','指定避難所名','指定緊急避難場所名'])if(p?.[k])return p[k];
 return fallback;
}
function infoRows(p){
 const rows=[];
 for(const k of ['address','住所','所在地','備考','remarks'])if(p?.[k])rows.push(`<b>${esc(k)}：</b>${esc(p[k])}`);
 return [...new Set(rows)].slice(0,4).join('<br>');
}
async function fetchShelterTile(type,z,x,y,kind,hazardLabel=''){
 const key=type+'/'+z+'/'+x+'/'+y;
 if(loaded[kind].has(key))return 0;
 loaded[kind].add(key);
 try{
  const r=await fetch(`https://cyberjapandata.gsi.go.jp/xyz/${type}/${z}/${x}/${y}.geojson`);
  if(!r.ok)return 0;
  const gj=await r.json();let n=0;
  for(const f of (gj.features||[])){
   if(!f.geometry||f.geometry.type!=='Point')continue;
   const [lon,lat]=f.geometry.coordinates,p=f.properties||{};
   const name=getName(p,kind==='shelter'?'指定避難所':'指定緊急避難場所');
   if(kind==='emergency'){
    const key2=`${lat.toFixed(6)},${lon.toFixed(6)},${name}`;
    if(emergencyPoints.has(key2)){
      emergencyPoints.get(key2).hazards.add(hazardLabel);
      continue;
    }
    const obj={hazards:new Set([hazardLabel]), marker:null};
    obj.marker=L.circleMarker([lat,lon],{radius:6,color:'#A05239',weight:2,fillColor:'#E9A17E',fillOpacity:.82});
    obj.marker.bindPopup(()=>`<div class="popup-title">${badge('A')} 🏃 ${esc(name)}</div><div class="small">${infoRows(p)}${obj.hazards.size?'<br><b>対応災害：</b>'+[...obj.hazards].map(esc).join('・'):''}<br><b>注意：</b>指定情報であり、現在開設中とは限りません。</div><a class="src" href="https://www.gsi.go.jp/bousaichiri/hinanbasho" target="_blank" rel="noopener">国土地理院で確認 ↗</a>`);
    obj.marker.addTo(groups.emergency);emergencyPoints.set(key2,obj);n++;
   }else{
    const welfare=type==='sfh';
    L.circleMarker([lat,lon],{radius:6,color:welfare?'#725487':'#376E55',weight:2,fillColor:welfare?'#BBA5C9':'#83B25B',fillOpacity:.82})
     .bindPopup(`<div class="popup-title">${badge('A')} ${welfare?'♿':'🏠'} ${esc(name)}</div><div class="small">${infoRows(p)}<br><b>種類：</b>${welfare?'福祉避難所':'指定避難所'}<br><b>注意：</b>指定情報であり、現在開設中とは限りません。</div><a class="src" href="https://www.gsi.go.jp/bousaichiri/hinanbasho" target="_blank" rel="noopener">国土地理院で確認 ↗</a>`)
     .addTo(groups.shelter);n++;
   }
  }
  return n;
 }catch(e){return 0}
}
async function refreshShelters(){
 if(map.getZoom()<9){status.textContent='避難所を見るにはズーム9以上まで拡大してください。';return;}
 const ts=tilesInView();if(ts.length>80){status.textContent='表示範囲が広すぎます。もう少しズームしてください。';return;}
 let n=0;
 if(active.shelter)for(const [z,x,y] of ts){
  n+=await fetchShelterTile('sih',z,x,y,'shelter');
  n+=await fetchShelterTile('sfh',z,x,y,'shelter');
 }
 if(active.emergency){
  const types=[['skhb01','洪水'],['skhb02','土砂災害'],['skhb03','高潮'],['skhb04','地震'],['skhb05','津波'],['skhb06','大規模な火事'],['skhb07','内水氾濫'],['skhb08','火山']];
  for(const [z,x,y] of ts)for(const [tp,label] of types)n+=await fetchShelterTile(tp,z,x,y,'emergency',label);
 }
 status.textContent=`${badge('A')} 表示範囲の公式避難情報を確認しました${n?'（新規 '+n+'件）':''}。`;
}

// AMeDAS
let amedasTable=null,amedasData={},amedasLatest='',amedasLoaded=false;
function dm(a){return Number(a?.[0]||0)+Number(a?.[1]||0)/60;}
function vv(v){return Array.isArray(v)?v[0]:null;}
function amedasPopup(id,s,d){
 const rows=[], vals=[
  ['10分雨量',vv(d.precipitation10m),'mm'],['1時間雨量',vv(d.precipitation1h),'mm'],
  ['気温',vv(d.temp),'℃'],['湿度',vv(d.humidity),'%'],['風速',vv(d.wind),'m/s'],['積雪',vv(d.snow),'cm']
 ];
 vals.forEach(([k,v,u])=>{if(v!==null&&v!==undefined)rows.push(`<b>${k}：</b>${v} ${u}`)});
 return `<div class="popup-title">${badge('A')} ☔ ${esc(s.kjName||id)}</div><div class="small">${rows.join('<br>')||'最新値を取得できませんでした。'}<br><b>観測時刻：</b>${esc(amedasLatest||'—')}</div><a class="src" href="https://www.jma.go.jp/bosai/amedas/" target="_blank" rel="noopener">気象庁アメダス ↗</a>`;
}
async function loadAmedas(){
 if(amedasLoaded){redrawAmedas();return;}
 status.textContent='気象庁アメダスを取得中…';
 try{
  const [tr,lr]=await Promise.all([
   fetch('https://www.jma.go.jp/bosai/amedas/const/amedastable.json'),
   fetch('https://www.jma.go.jp/bosai/amedas/data/latest_time.txt')
  ]);
  if(!tr.ok||!lr.ok)throw new Error('JMA fetch failed');
  amedasTable=await tr.json();amedasLatest=(await lr.text()).trim();
  const stamp=amedasLatest.replace(/[-:TZ+.]/g,'').slice(0,14);
  const dr=await fetch(`https://www.jma.go.jp/bosai/amedas/data/map/${stamp}.json`);
  if(!dr.ok)throw new Error('JMA map fetch failed');
  amedasData=await dr.json();amedasLoaded=true;redrawAmedas();
 }catch(e){
  status.textContent='アメダス取得に失敗しました。気象庁公式ページから確認してください。';
 }
}
function redrawAmedas(){
 groups.amedas.clearLayers();if(!active.amedas||!amedasTable)return;
 const b=map.getBounds();let n=0;
 for(const [id,s] of Object.entries(amedasTable)){
  const lat=dm(s.lat),lon=dm(s.lon);if(!b.contains([lat,lon]))continue;
  const d=amedasData[id]||{},rain=vv(d.precipitation1h);
  const col=(rain!==null&&rain>=20)?'#B64A52':((rain!==null&&rain>0)?'#3E79A8':'#557A72');
  L.circleMarker([lat,lon],{radius:5,color:col,weight:2,fillColor:'#fff',fillOpacity:.72})
   .bindTooltip(s.kjName||id).bindPopup(amedasPopup(id,s,d)).addTo(groups.amedas);n++;
 }
 status.innerHTML=`${badge('A')} 表示範囲のアメダス ${n}地点 ／ ${esc(amedasLatest||'')}`;
}

map.on('moveend zoomend',()=>{if(active.shelter||active.emergency)refreshShelters();if(active.amedas&&amedasLoaded)redrawAmedas();});

document.querySelectorAll('.fbtn').forEach(btn=>{
 btn.onclick=()=>{
  const k=btn.dataset.layer;active[k]=!active[k];btn.classList.toggle('active',active[k]);
  if(raster[k]){if(active[k])raster[k].addTo(map);else map.removeLayer(raster[k]);}
  else if(groups[k]){if(active[k])groups[k].addTo(map);else map.removeLayer(groups[k]);}
  if(k==='shelter'||k==='emergency')refreshShelters();
  if(k==='amedas'&&active[k])loadAmedas();
 };
});

function openRiver(){
 const c=map.getCenter(),z=Math.max(9,Math.min(15,map.getZoom()));
 const u=`https://www.river.go.jp/kawabou/pc/tmlist?clat=${c.lat.toFixed(6)}&clon=${c.lng.toFixed(6)}&fld=0&zm=${z}`;
 window.open(u,'_blank','noopener');
}
let here=null,accuracy=null;
function locateMe(){
 if(!navigator.geolocation){alert('このブラウザは位置情報に対応していません。');return;}
 navigator.geolocation.getCurrentPosition(p=>{
  const lat=p.coords.latitude,lon=p.coords.longitude;
  if(here)map.removeLayer(here);if(accuracy)map.removeLayer(accuracy);
  here=L.circleMarker([lat,lon],{radius:8,color:'#16454F',weight:3,fillColor:'#fff',fillOpacity:1}).addTo(map).bindPopup('現在地');
  accuracy=L.circle([lat,lon],{radius:p.coords.accuracy||50,color:'#16454F',weight:1,fillOpacity:.04}).addTo(map);
  map.setView([lat,lon],12);here.openPopup();
 },()=>alert('位置情報を取得できませんでした。HTTPS/localhostで開き、ブラウザの位置情報許可を確認してください。'),{enableHighAccuracy:true,timeout:10000});
}
setTimeout(refreshShelters,350);
</script>
</body>
</html>
